<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё Цифровое Пространство</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: #121216;
            --accent-glow: #00f2fe;
            --accent-neon: #4facfe;
            --text-main: #ffffff;
            --text-muted: #8f9cae;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Задний фон с эффектом свечения */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-glow));
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.2;
            top: 10%;
            left: 10%;
            z-index: 0;
        }

        /* Анимация плавного проявления карточки снизу вверх */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            z-index: 1;
            transform: translateY(0);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            
            animation: cardAppear 1s ease-out forwards;
            opacity: 0;
        }

        @keyframes cardAppear {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 30px 60px rgba(0, 242, 254, 0.1);
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 24px;
            animation: fadeIn 0.8s ease-out 0.3s forwards;
            opacity: 0;
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e1e24, #2a2a35);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .pulse-ring {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 2px solid var(--accent-glow);
            border-radius: 50%;
            animation: pulse 2s infinite;
            opacity: 0;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        /* Анимация переливающегося текста заголовка */
        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(270deg, #ffffff, var(--accent-glow), var(--accent-neon), #ffffff);
            background-size: 600% 600%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGradient 6s ease infinite, fadeIn 0.8s ease-out 0.5s forwards;
            opacity: 0;
        }

        @keyframes textGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Анимация текста (наплыв слева) */
        .tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 12px;
            background: rgba(0, 242, 254, 0.1);
            color: var(--accent-glow);
            border-radius: 12px;
            margin-bottom: 20px;
            
            animation: slideInLeft 0.8s cubic-bezier(0.19, 1, 0.22, 1) 0.6s forwards;
            opacity: 0;
        }

        /* Анимация текста (наплыв справа) */
        .bio {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            
            animation: slideInRight 0.8s cubic-bezier(0.19, 1, 0.22, 1) 0.7s forwards;
            opacity: 0;
        }

        @keyframes slideInLeft {
            from { transform: translateX(-30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideInRight {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.8s ease-out 0.9s forwards;
            opacity: 0;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, var(--accent-neon), var(--accent-glow));
            color: #000;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.2);
        }

        .btn-primary:hover {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.4);
            transform: scale(1.02);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <div class="pulse-ring"></div>
            <div class="avatar">⚡</div>
        </div>
        
        <h1>Твой Никнейм</h1>
        <div class="tag">Frontend Developer</div>
        
        <p class="bio">
           приветствую всех на мокм первом  сайте. Проект собран с телефона и развернут на gitHub pages. ээ ткт веб технологи и стильный интерактив.
        </p>

        <div class="links-container">
            <a href="https://t.me" target="_blank" class="btn btn-primary">🥺 Мой мессенджер Мах</a>
            <a href="#" class="btn btn-secondary">📁 Мои проекты</a>
        </div>
    </div>

</body>
</html>
